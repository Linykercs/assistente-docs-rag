name: Evals

# Runs the full pipeline against the real docs and the real LLM, so it is manual only.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM: local (gratuito, sem chave), claude, groq ou gemini"
        type: choice
        options: [local, claude, groq, gemini]
        default: local
      model:
        description: "Modelo (vazio = padrão do provedor)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistente_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assistente_docs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Open model served on the runner itself: no account, key or quota. Idle for other providers.
      ollama:
        image: ollama/ollama:latest
        env:
          # The prompt carries ~6 documentation chunks; the default context would truncate it.
          OLLAMA_CONTEXT_LENGTH: "8192"
        ports:
          - 11434:11434

    env:
      LLM_PROVIDER: ${{ inputs.provider == 'claude' && 'anthropic' || 'openai_compat' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_REASONING_EFFORT: ${{ (inputs.provider == 'groq' || inputs.provider == 'gemini') && 'low' || '' }}
      DEFAULT_MODEL: >-
        ${{ inputs.provider == 'local' && 'qwen2.5:3b'
        || inputs.provider == 'groq' && 'openai/gpt-oss-120b'
        || inputs.provider == 'gemini' && 'gemini-flash-latest'
        || 'claude-sonnet-5-5' }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistente_docs
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Select LLM provider
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          model="${MODEL:-$DEFAULT_MODEL}"
          echo "LLM_MODEL=$model" >> "$GITHUB_ENV"
          echo "JUDGE_MODEL=$model" >> "$GITHUB_ENV"
          case "$PROVIDER" in
            local)
              echo "LLM_BASE_URL=http://localhost:11434/v1" >> "$GITHUB_ENV"
              echo "LLM_API_KEY=ollama" >> "$GITHUB_ENV" ;;
            groq)
              echo "LLM_BASE_URL=https://api.groq.com/openai/v1" >> "$GITHUB_ENV"
              echo "LLM_API_KEY=$GROQ_API_KEY" >> "$GITHUB_ENV" ;;
            gemini)
              echo "LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai" >> "$GITHUB_ENV"
              echo "LLM_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV" ;;
          esac

      - name: Download local model
        if: inputs.provider == 'local'
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          curl -sSf http://localhost:11434/api/pull -d "{\"model\": \"$LLM_MODEL\", \"stream\": false}"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-multilingual-e5-large

      - name: Create schema
        run: uv run assistente-docs init-db

      - name: Ingest documentation
        run: uv run assistente-docs ingest

      - name: Run evals
        run: uv run assistente-docs eval

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evals/reports/*.md
            evals/reports/*.json
          if-no-files-found: warn
