name: Evals

# Runs the full pipeline against the real docs and the real LLM, so it is manual only.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM: claude (secret ANTHROPIC_API_KEY) ou github-models (gratuito)"
        type: choice
        options: [claude, github-models]
        default: claude
      model:
        description: "Modelo do GitHub Models (só para github-models)"
        type: string
        default: openai/gpt-4.1-mini

# GitHub Models authenticates with the workflow's own GITHUB_TOKEN.
permissions:
  contents: read
  models: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistente_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assistente_docs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LLM_PROVIDER: ${{ inputs.provider == 'github-models' && 'openai_compat' || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_API_KEY: ${{ secrets.GITHUB_TOKEN }}
      LLM_MODEL: ${{ inputs.provider == 'github-models' && inputs.model || 'claude-sonnet-5-5' }}
      JUDGE_MODEL: ${{ inputs.provider == 'github-models' && inputs.model || 'claude-sonnet-5-5' }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistente_docs
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-multilingual-e5-large

      - name: Create schema
        run: uv run assistente-docs init-db

      - name: Ingest documentation
        run: uv run assistente-docs ingest

      - name: Run evals
        run: uv run assistente-docs eval

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evals/reports/*.md
            evals/reports/*.json
          if-no-files-found: warn
