name: Evals

# Runs the full pipeline against the real docs and the real LLM, so it is manual only.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM: local (gratuito, sem chave), claude, groq ou gemini"
        type: choice
        options: [local, claude, groq, gemini]
        default: local
      model:
        description: "Modelo (vazio = padrão do provedor)"
        type: string
        default: ""
      judge:
        description: "Juiz: o mesmo provedor das respostas, ou um juiz fixo para comparar modelos"
        type: choice
        options: [mesmo, groq, gemini, claude]
        default: mesmo
      judge_model:
        description: "Modelo do juiz (vazio = padrão do provedor do juiz)"
        type: string
        default: ""
      top_k:
        description: "Trechos recuperados por pergunta (vazio = padrão do projeto, 10)"
        type: string
        default: ""
      retrieval:
        description: "Busca: vetorial (padrão) ou híbrida (vetorial + full-text do Postgres)"
        type: choice
        options: [vector, hybrid]
        default: vector
      only_retrieval:
        description: "Mede só o retrieval (sem LLM nem juiz, não gasta cota)"
        type: boolean
        default: false
      cases:
        description: "Só estes casos, ex.: 7,23,24 (vazio = todos)"
        type: string
        default: ""
      embedding:
        description: "Modelo de embeddings"
        type: choice
        options: [e5-large, minilm, mpnet, qwen3-q]
        default: e5-large
      repeat:
        description: "Quantas vezes rodar a suíte (resumo com média, mínimo e máximo)"
        type: string
        default: "1"
      expand_top:
        description: "Trechos expandidos para vizinhos e seção (vazio = padrão do projeto, 3; 0 = desligado)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistente_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assistente_docs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Open model served on the runner itself: no account, key or quota. Idle for other providers.
      ollama:
        image: ollama/ollama:latest
        env:
          # The prompt carries ~6 documentation chunks; the default context would truncate it.
          OLLAMA_CONTEXT_LENGTH: "8192"
        ports:
          - 11434:11434

    env:
      LLM_PROVIDER: ${{ inputs.provider == 'claude' && 'anthropic' || 'openai_compat' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_REASONING_EFFORT: ${{ (inputs.provider == 'groq' || inputs.provider == 'gemini') && 'low' || '' }}
      # Repeatable answers, so a change in the scores comes from the code, not from sampling.
      LLM_TEMPERATURE: ${{ inputs.provider != 'claude' && '0' || '' }}
      # Ollama and Groq accept a fixed seed; Gemini rejects the field.
      LLM_SEED: ${{ (inputs.provider == 'local' || inputs.provider == 'groq') && '0' || '' }}
      DEFAULT_MODEL: >-
        ${{ inputs.provider == 'local' && 'qwen2.5:3b'
        || inputs.provider == 'groq' && 'openai/gpt-oss-120b'
        || inputs.provider == 'gemini' && 'gemini-flash-latest'
        || 'claude-sonnet-5-5' }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistente_docs
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Select LLM provider
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          JUDGE: ${{ inputs.judge }}
          JUDGE_MODEL_INPUT: ${{ inputs.judge_model }}
          TOP_K: ${{ inputs.top_k }}
          RETRIEVAL: ${{ inputs.retrieval }}
          EXPAND_TOP: ${{ inputs.expand_top }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          model="${MODEL:-$DEFAULT_MODEL}"
          echo "LLM_MODEL=$model" >> "$GITHUB_ENV"
          echo "JUDGE_MODEL=$model" >> "$GITHUB_ENV"
          case "$PROVIDER" in
            local)
              echo "LLM_BASE_URL=http://localhost:11434/v1" >> "$GITHUB_ENV"
              echo "LLM_API_KEY=ollama" >> "$GITHUB_ENV" ;;
            groq)
              echo "LLM_BASE_URL=https://api.groq.com/openai/v1" >> "$GITHUB_ENV"
              echo "LLM_API_KEY=$GROQ_API_KEY" >> "$GITHUB_ENV" ;;
            gemini)
              echo "LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai" >> "$GITHUB_ENV"
              echo "LLM_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV" ;;
          esac

          if [ -n "$TOP_K" ]; then echo "RETRIEVAL_TOP_K=$TOP_K" >> "$GITHUB_ENV"; fi
          echo "RETRIEVAL_MODE=${RETRIEVAL:-vector}" >> "$GITHUB_ENV"
          if [ -n "$EXPAND_TOP" ]; then echo "CONTEXT_EXPAND_TOP=$EXPAND_TOP" >> "$GITHUB_ENV"; fi

          # A fixed judge grades every model the same way. Answers keep the provider above.
          case "$JUDGE" in
            groq)
              echo "JUDGE_MODEL=${JUDGE_MODEL_INPUT:-openai/gpt-oss-120b}" >> "$GITHUB_ENV"
              echo "JUDGE_PROVIDER=openai_compat" >> "$GITHUB_ENV"
              echo "JUDGE_BASE_URL=https://api.groq.com/openai/v1" >> "$GITHUB_ENV"
              echo "JUDGE_API_KEY=$GROQ_API_KEY" >> "$GITHUB_ENV"
              echo "JUDGE_REASONING_EFFORT=low" >> "$GITHUB_ENV"
              echo "JUDGE_TEMPERATURE=0" >> "$GITHUB_ENV"
              echo "JUDGE_SEED=0" >> "$GITHUB_ENV" ;;
            gemini)
              echo "JUDGE_MODEL=${JUDGE_MODEL_INPUT:-gemini-flash-latest}" >> "$GITHUB_ENV"
              echo "JUDGE_PROVIDER=openai_compat" >> "$GITHUB_ENV"
              echo "JUDGE_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai" >> "$GITHUB_ENV"
              echo "JUDGE_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV"
              echo "JUDGE_REASONING_EFFORT=low" >> "$GITHUB_ENV"
              echo "JUDGE_TEMPERATURE=0" >> "$GITHUB_ENV" ;;
            claude)
              echo "JUDGE_MODEL=${JUDGE_MODEL_INPUT:-claude-sonnet-5-5}" >> "$GITHUB_ENV"
              echo "JUDGE_PROVIDER=anthropic" >> "$GITHUB_ENV" ;;
          esac

      - name: Select embedding model
        env:
          EMBEDDING: ${{ inputs.embedding }}
        run: |
          # E5 is trained with "query: "/"passage: " prefixes; the others take raw text, and
          # Qwen3 recommends an instruction on the query side only.
          case "${EMBEDDING:-e5-large}" in
            e5-large)
              echo "EMBEDDING_MODEL=intfloat/multilingual-e5-large" >> "$GITHUB_ENV"
              echo "EMBEDDING_DIM=1024" >> "$GITHUB_ENV" ;;
            minilm)
              echo "EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2" >> "$GITHUB_ENV"
              echo "EMBEDDING_DIM=384" >> "$GITHUB_ENV"
              echo "EMBEDDING_QUERY_PREFIX=" >> "$GITHUB_ENV"
              echo "EMBEDDING_PASSAGE_PREFIX=" >> "$GITHUB_ENV" ;;
            mpnet)
              echo "EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-mpnet-base-v2" >> "$GITHUB_ENV"
              echo "EMBEDDING_DIM=768" >> "$GITHUB_ENV"
              echo "EMBEDDING_QUERY_PREFIX=" >> "$GITHUB_ENV"
              echo "EMBEDDING_PASSAGE_PREFIX=" >> "$GITHUB_ENV" ;;
            qwen3-q)
              echo "EMBEDDING_MODEL=Qwen/Qwen3-Embedding-0.6B-Q" >> "$GITHUB_ENV"
              echo "EMBEDDING_DIM=1024" >> "$GITHUB_ENV"
              {
                echo "EMBEDDING_QUERY_PREFIX<<PREFIX_EOF"
                printf 'Instruct: Given a question, retrieve documentation passages that answer it\nQuery: \n'
                echo "PREFIX_EOF"
              } >> "$GITHUB_ENV"
              echo "EMBEDDING_PASSAGE_PREFIX=" >> "$GITHUB_ENV" ;;
          esac

      - name: Download local model
        if: inputs.provider == 'local'
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          curl -sSf http://localhost:11434/api/pull -d "{\"model\": \"$LLM_MODEL\", \"stream\": false}"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-${{ inputs.embedding || 'e5-large' }}

      - name: Create schema
        run: uv run assistente-docs init-db

      - name: Ingest documentation
        run: uv run assistente-docs ingest

      - name: Run evals
        env:
          REPEAT: ${{ inputs.repeat }}
          CASES: ${{ inputs.cases }}
          ONLY_RETRIEVAL: ${{ inputs.only_retrieval }}
        run: |
          args=(--repeat "${REPEAT:-1}")
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          if [ "$ONLY_RETRIEVAL" = "true" ]; then args+=(--only-retrieval); fi
          uv run assistente-docs eval "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evals/reports/*.md
            evals/reports/*.json
          if-no-files-found: warn
