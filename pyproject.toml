[project]
name = "assistente-docs-rag"
version = "0.1.0"
description = "Assistente que responde dúvidas sobre a documentação da API do Asaas, com RAG e evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.0,<2",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "httpx>=0.27",
    "markdownify>=0.13",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
observability = ["langfuse>=3,<4"]

[project.scripts]
assistente-docs = "assistente_docs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistente_docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
